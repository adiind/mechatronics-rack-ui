substitutions:
  pixel_count: "100"

esphome:
  name: ledwall-node05
  friendly_name: LED Wall Node 05
  on_boot:
    # XIAO ESP32C6: GPIO14 powers the RF switch (LOW = on) and GPIO3 picks the
    # antenna (LOW = onboard chip antenna, HIGH = external u.FL). Must run
    # before wifi starts or the radio comes up on a disconnected connector.
    - priority: 900
      then:
        - output.turn_off: rf_switch_power
        - output.turn_off: rf_antenna_select
    - priority: -100
      then:
        # Keep the logical light enabled so direct pixel-buffer writes are
        # visible, but initialize every output channel to black.
        - light.turn_on:
            id: led_strip
            brightness: 100%
            red: 0%
            green: 0%
            blue: 0%
            transition_length: 0s

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

output:
  - platform: gpio
    pin: GPIO14
    id: rf_switch_power
  - platform: gpio
    pin: GPIO3
    id: rf_antenna_select

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Device-Northwestern is hidden: without these the board scans, fails with
  # 'Probe Request Unsuccessful', and drops MQTT on keepalive.
  fast_connect: true
  power_save_mode: none

ota:
  - platform: esphome
    password: !secret ota_password

json:

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ledwall/node05/internal
  discovery: false
  log_topic: null
  reboot_timeout: 0s
  birth_message:
    topic: ledwall/node05/status
    payload: online
    qos: 0
    retain: true
  will_message:
    topic: ledwall/node05/status
    payload: offline
    qos: 0
    retain: true
  shutdown_message:
    topic: ledwall/node05/status
    payload: offline
    qos: 0
    retain: true
  on_message:
    topic: ledwall/node05/set
    qos: 0
    then:
      - lambda: |-
          auto publish_error = [&](const char *error) {
            id(mqtt_client).publish_json("ledwall/node05/ack", [=](JsonObject root) {
              root["ok"] = false;
              root["error"] = error;
            });
          };

          bool parsed = json::parse_json(x, [&](JsonObject root) -> bool {
            if (root.isNull() || !root["op"].is<const char *>()) {
              publish_error("invalid_op");
              return true;
            }

            std::string op = root["op"].as<std::string>();
            int first = 0;
            int last_exclusive = 0;
            uint8_t r = 0;
            uint8_t g = 0;
            uint8_t b = 0;

            if (op == "off") {
              if (root.size() != 1) {
                publish_error("invalid_op");
                return true;
              }
              first = 0;
              last_exclusive = ${pixel_count};
            } else {
              if (!root["rgb"].is<JsonArray>()) {
                publish_error("invalid_rgb");
                return true;
              }
              JsonArray rgb = root["rgb"].as<JsonArray>();
              if (rgb.size() != 3) {
                publish_error("invalid_rgb");
                return true;
              }
              for (size_t i = 0; i < 3; i++) {
                JsonVariant component = rgb[i];
                if (component.is<bool>() || !component.is<int>()) {
                  publish_error("invalid_rgb");
                  return true;
                }
                int value = component.as<int>();
                if (value < 0 || value > 255) {
                  publish_error("invalid_rgb");
                  return true;
                }
              }
              r = rgb[0].as<uint8_t>();
              g = rgb[1].as<uint8_t>();
              b = rgb[2].as<uint8_t>();

              if (op == "fill") {
                if (root.size() != 2) {
                  publish_error("invalid_op");
                  return true;
                }
                first = 0;
                last_exclusive = ${pixel_count};
              } else if (op == "pixel") {
                if (root.size() != 3 || root["index"].is<bool>() ||
                    !root["index"].is<int>()) {
                  publish_error("invalid_index");
                  return true;
                }
                int index = root["index"].as<int>();
                if (index < 0 || index >= ${pixel_count}) {
                  publish_error("invalid_index");
                  return true;
                }
                first = index;
                last_exclusive = index + 1;
              } else if (op == "range") {
                if (root.size() != 4 || root["start"].is<bool>() ||
                    root["count"].is<bool>() || !root["start"].is<int>() ||
                    !root["count"].is<int>()) {
                  publish_error("invalid_range");
                  return true;
                }
                int start = root["start"].as<int>();
                int count = root["count"].as<int>();
                if (start < 0 || start >= ${pixel_count} || count < 1 || count > ${pixel_count} ||
                    start + count > ${pixel_count}) {
                  publish_error("invalid_range");
                  return true;
                }
                first = start;
                last_exclusive = start + count;
              } else {
                publish_error("invalid_op");
                return true;
              }
            }

            auto *strip = static_cast<light::AddressableLight *>(id(led_strip).get_output());
            for (int i = first; i < last_exclusive; i++) {
              (*strip)[i] = Color(r, g, b);
            }
            strip->schedule_show();
            id(mqtt_client).publish_json("ledwall/node05/ack", [=](JsonObject ack) {
              ack["ok"] = true;
              ack["op"] = op;
            });
            return true;
          });

          if (!parsed) {
            publish_error("invalid_json");
          }

light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    internal: true
    pin: GPIO0
    num_leds: ${pixel_count}
    chipset: WS2811
    channel_colors: GRB
    rmt_symbols: 48
    color_correct: [80%, 80%, 80%]   # was 55%; Adi asked for >=80% on 2026-09-06
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
